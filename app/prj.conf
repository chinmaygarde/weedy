CONFIG_GPIO=y
CONFIG_LOG=y

# C++
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Pigweed
CONFIG_PIGWEED_LOG_ZEPHYR=y
CONFIG_PIGWEED_ASSERT_ZEPHYR=y
CONFIG_PIGWEED_DIGITAL_IO=y
CONFIG_PIGWEED_THREAD_SLEEP=y
# pw_thread_zephyr.sleep links pw_thread.thread, but PIGWEED_THREAD_SLEEP
# doesn't select it.
CONFIG_PIGWEED_THREAD=y
